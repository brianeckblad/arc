<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC · Feature Editor</title>
  <link rel="stylesheet" href="/assets/gui.css" />
</head>
<body>
  <header class="hdr">
    <div class="logo"><b>ARC</b><span>Feature Editor</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="grow"></div>
    <div class="search"><input id="search" type="text" placeholder="Filter…" autocomplete="off"/></div>
    <button class="btn primary" id="done">✓ Save &amp; Exit</button>
  </header>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-bg" id="modal"><div class="modal"><button class="mclose" id="mclose">×</button><div id="mbody"></div></div></div>
  <div class="closed" id="closedv"><h1>✓ Editor closed</h1><p>You can return to the ARC shell now — this tab can be closed.</p></div>

<script src="/assets/gui.js"></script>
<script>
const SECTIONS=[
  {key:"areas",label:"Areas"},
  {key:"features",label:"Features"},
  {key:"structure",label:"Command Structure"},
  {key:"aliases",label:"Aliases"},
  {key:"builtins",label:"Built-ins"},
  {key:"advanced",label:"Advanced"},
];
const HELP_TOPIC={areas:"areas",features:"features",structure:"structure",aliases:"aliases",builtins:"builtins",advanced:"files"};
let cur={section:"features",group:null};
let filter="";
// Monotonic render token: every loadMain() bumps it.  Serialized + latest-wins
// so overlapping async renders (fast typing in the filter box) can't both append
// to #main and produce duplicate cards.
let _renderSeq=0;
let _renderChain=Promise.resolve();

// ---- helpers ----
// esc, escA, matchTxt, api, post, toast, flash, qmark, showHelp, el all come
// from the shared /assets/gui.js — the single source of truth both consoles use.

// ---- router ----
function go(section,group){location.hash=section+(group?("/"+encodeURIComponent(group)):"");}
function parseHash(){const h=decodeURIComponent(location.hash.slice(1));const [s,g]=h.split("/");
  return {section:SECTIONS.some(x=>x.key===s)?s:"features",group:g||null};}
async function route(){
  cur=parseHash();filter="";document.getElementById("search").value="";
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.k===cur.section));
  await loadSidebar();
  await loadMain();
}
window.addEventListener("hashchange",route);

async function loadSidebar(){
  const side=document.getElementById("side");
  if(cur.section==="areas"){
    // Areas is a single management page — a minimal sidebar for consistency.
    side.innerHTML=`<div class="stitle">Manage</div><div class="g-item active">All areas</div>
      <div class="muted" style="padding:.6rem .5rem;font-size:12px">Enable or disable whole capability areas. Disabling turns every command in an area off.</div>`;
    return;
  }
  const nav=await api("/api/nav?section="+cur.section);
  const groups=nav.groups||[];
  if(!cur.group && groups.length)cur.group=groups[0].key;
  side.innerHTML=`<div class="stitle">${cur.section==="advanced"?"Files":(cur.section==="aliases"||cur.section==="builtins"?"Groups":"Areas")}</div>`;
  groups.forEach(g=>{
    const it=el("div","g-item"+(g.key===cur.group?" active":""));
    let dot="";
    if(cur.section==="features"){const on=g.meta&&g.meta.active>0;dot=`<span class="dot ${on?'':'none'}"></span>`;}
    it.innerHTML=`${dot}<span>${esc(g.label)}</span>`+(g.count?`<span class="c">${g.count}</span>`:"");
    it.onclick=()=>go(cur.section,g.key);
    side.appendChild(it);
  });
  if(!groups.length)side.innerHTML+=`<div class="muted" style="padding:.5rem">Nothing here.</div>`;
}

function pageHead(main,title){
  const crumb=SECTIONS.find(s=>s.key===cur.section).label;
  main.appendChild(el("div","crumb",`${esc(crumb)} ${cur.group?"· "+esc(title||cur.group):""}`));
  const ph=el("div","phead");ph.appendChild(el("h1",null,esc(title||crumb)));
  ph.appendChild(qmark("topic="+HELP_TOPIC[cur.section]));
  return ph;
}

// Serialize renders and keep only the latest: a newer loadMain() call bumps
// _renderSeq, and queued stale renders bail before touching the DOM.  Without
// this, fast typing in the filter box let two in-flight renders both clear then
// both append after their awaits resolved — showing every match twice.
function loadMain(){
  const seq=++_renderSeq;
  _renderChain=_renderChain.then(()=>{ if(seq!==_renderSeq)return; return _loadMain(); });
  return _renderChain;
}
async function _loadMain(){
  const main=document.getElementById("main");main.innerHTML="";
  if(cur.section==="areas")return mainAreas(main);
  if(cur.section==="features")return mainFeatures(main);
  if(cur.section==="structure")return mainStructure(main);
  if(cur.section==="aliases")return mainAliases(main);
  if(cur.section==="builtins")return mainBuiltins(main);
  if(cur.section==="advanced")return mainAdvanced(main);
}

// ---- AREAS (enable/disable whole capability areas) ----
async function mainAreas(main){
  const data=await api("/api/areas");
  const ph=el("div","phead");ph.appendChild(el("h1",null,"Feature Areas"));
  ph.appendChild(qmark("topic=areas"));main.appendChild(ph);
  const intro=el("div");intro.style.cssText="color:var(--text-2);font-size:13.5px;margin:-.5rem 0 1.1rem;max-width:80ch";
  intro.textContent="Turn a whole capability area on or off. Disabling hides all its commands from the shell, blocks them from running, and removes the area from Features, Command Structure and Advanced. Your individual feature settings are remembered and restored when you re-enable it.";
  main.appendChild(intro);
  const areas=(data.areas||[]).filter(a=>matchTxt(a.label,filter)||matchTxt(a.area,filter));
  if(!areas.length){main.appendChild(el("div","empty",`No areas match "<b>${esc(filter)}</b>".`));return;}
  areas.forEach(a=>main.appendChild(areaCard(a)));
}
function areaCard(a){
  const card=el("div","card");card.dataset.area=a.area;
  const active=a.counts.on+a.counts.dev;
  card.innerHTML=`<div class="rmain">
    <div class="rinfo"><div class="rtitle">${esc(a.label)}<span class="rtech">${esc(a.area)}</span></div>
      <div class="rsub">${a.feature_count} feature${a.feature_count===1?"":"s"} · ${active} on · ${a.counts.off} off${a.disabled?' · <span style="color:var(--red)">area disabled</span>':''}</div></div>
    <div class="ctrl"><label>${a.disabled?'<span style="color:var(--red)">Disabled</span>':'<span style="color:var(--green)">Enabled</span>'}</label>
      <div class="toggle ${a.disabled?'':'on'}" id="tog"><div class="knob"></div></div></div></div>`;
  card.querySelector(".rinfo").prepend(qmark("topic=areas"));
  card.querySelector("#tog").onclick=(e)=>toggleArea(a,card,e.currentTarget);
  return card;
}
async function toggleArea(a,card,tog){
  try{const r=await post("/api/area",{area:a.area,disabled:!a.disabled});
    a.disabled=r.disabled;tog.classList.toggle("on",!a.disabled);
    const lab=card.querySelector(".ctrl label");lab.innerHTML=a.disabled?'<span style="color:var(--red)">Disabled</span>':'<span style="color:var(--green)">Enabled</span>';
    const sub=card.querySelector(".rsub");const active=a.counts.on+a.counts.dev;
    sub.innerHTML=`${a.feature_count} feature${a.feature_count===1?"":"s"} · ${active} on · ${a.counts.off} off${a.disabled?' · <span style="color:var(--red)">area disabled</span>':''}`;
    flash(card);toast(`${a.label}: ${a.disabled?"disabled — all commands off":"enabled"}`);
  }catch(e){toast("Error: "+e.message,true);}
}

// ---- FEATURES ----
async function mainFeatures(main){
  const searching=!!filter;
  // When filtering, search across ALL areas (area="") so bulk actions can hit
  // every match; otherwise scope to the selected area for the counts + header.
  const data=await api("/api/features?area="+encodeURIComponent(searching?"":(cur.group||"")));

  if(searching){
    let flags=[];const seen=new Set();
    (data.groups||[]).forEach(gr=>(gr.flags||[]).forEach(f=>{
      if(seen.has(f.flag))return;seen.add(f.flag);f._areaLabel=gr.label;flags.push(f);}));
    const vis=flags.filter(f=>featMatch(f));
    const ph=el("div","phead");ph.appendChild(el("h1",null,"Search"));
    ph.appendChild(qmark("topic=features"));main.appendChild(ph);
    main.appendChild(bulkBar(vis,`${vis.length} match${vis.length===1?"":"es"} for “${esc(filter)}” across all areas`,"Set all matches:"));
    if(!vis.length){main.appendChild(el("div","empty",`No features match "<b>${esc(filter)}</b>".`));return;}
    vis.forEach(f=>main.appendChild(featureCard(f,true)));
    return;
  }

  const g=data.groups[0];const hdr=data.header;
  const ph=pageHead(main,hdr?hdr.label:"Features");main.appendChild(ph);
  if(hdr){
    const bar=el("div","areabar");
    bar.innerHTML=`<div class="counts">
      <span class="pill"><span class="sw on"></span>${hdr.counts.on} on</span>
      <span class="pill"><span class="sw dev"></span>${hdr.counts.dev} dev</span>
      <span class="pill"><span class="sw off"></span>${hdr.counts.off} off</span>
      <span class="pill"><span class="sw hidden"></span>${hdr.counts.hidden} hidden</span></div>
      <div class="spacer"></div>
      <span class="bulklab">Set all:</span>
      <div class="seg bulk">${FSTATES.map(s=>`<button data-v="${s}">${s.toUpperCase()}</button>`).join("")}</div>
      <button class="btn sm" id="disable-area">Disable area</button>`;
    const flags=g?g.flags:[];
    bar.querySelectorAll(".seg.bulk button").forEach(b=>b.onclick=()=>bulkApply(flags,b.dataset.v));
    bar.querySelector("#disable-area").onclick=()=>disableArea(hdr);
    main.appendChild(bar);
  }
  if(!g||!g.flags.length){main.appendChild(el("div","empty","No features in this area."));return;}
  const vis=g.flags.filter(f=>featMatch(f));
  if(!vis.length){main.appendChild(el("div","empty",`No features match "<b>${esc(filter)}</b>".`));return;}
  vis.forEach(f=>main.appendChild(featureCard(f)));
}
// A bulk-action bar: one button per state that applies to every flag in `list`.
function bulkBar(list,label,setLabel){
  const bar=el("div","areabar");
  bar.innerHTML=`<div class="counts"><span class="muted">${label}</span></div>
    <div class="spacer"></div>
    <span class="bulklab">${esc(setLabel||"Set all:")}</span>
    <div class="seg bulk">${FSTATES.map(s=>`<button data-v="${s}">${s.toUpperCase()}</button>`).join("")}</div>`;
  bar.querySelectorAll(".seg.bulk button").forEach(b=>b.onclick=()=>bulkApply(list,b.dataset.v));
  return bar;
}
// Apply one state to a list of flags, then refresh while preserving the filter.
async function bulkApply(list,state){
  const targets=(list||[]).filter(f=>f.state!==state);
  if(!targets.length){toast(`All already ${state.toUpperCase()}`);return;}
  let ok=0;
  for(const f of targets){try{await post("/api/feature",{flag:f.flag,state});ok++;}catch(e){}}
  toast(`Set ${ok} feature${ok===1?"":"s"} → ${state.toUpperCase()}`);
  loadSidebar();loadMain();
}
function featMatch(f){if(!filter)return true;return matchTxt(f.title,filter)||matchTxt(f.flag,filter)||matchTxt(f.subtitle,filter)||(f.commands||[]).some(c=>matchTxt(c.command,filter));}
function scopeSum(f){const s=[...new Set((f.commands||[]).map(c=>c.effective_scope))];if(!s.length)return"";
  const ov=(f.commands||[]).some(c=>c.overridden);const lab=s.length===1?s[0]:"mixed";const cls=s.length>1?"mixed":(ov?"override":"");
  return `<span class="badge ${cls}">${lab}${ov?" *":""}</span>`;}
const FSTATES=["on","dev","off","hidden"];
function featureCard(f,showArea){
  const card=el("div","card");card.dataset.flag=f.flag;const n=f.command_count||0;
  const area=showArea&&f._areaLabel?`<span class="rtech area">${esc(f._areaLabel)}</span>`:"";
  card.innerHTML=`<div class="rmain">
    <div class="rinfo"><div class="rtitle">${esc(f.title||f.flag)}<span class="rtech">${esc(f.flag)}</span>${area}</div>
      <div class="rsub">${esc(f.subtitle||"")}</div>
      <div class="rmeta">${scopeSum(f)}<span class="muted">${n} command${n===1?"":"s"}</span>${n?`<button class="expand">▸ scope</button>`:""}</div></div>
    <div class="seg st">${FSTATES.map(s=>`<button data-v="${s}" class="${f.state===s?'sel':''}">${s.toUpperCase()}</button>`).join("")}</div></div>
    <div class="detail"><div class="dhint">Where each command runs — code default preselected.</div>
      ${(f.commands||[]).map(scopeRow).join("")}</div>`;
  card.querySelector(".rinfo").prepend(qmark("flag="+encodeURIComponent(f.flag)));
  const ex=card.querySelector(".expand");if(ex)ex.onclick=()=>{card.classList.toggle("open");ex.textContent=card.classList.contains("open")?"▾ scope":"▸ scope";};
  card.querySelectorAll(".seg.st button").forEach(b=>b.onclick=()=>setFState(f,card,b.dataset.v));
  card.querySelectorAll(".crow").forEach(cr=>{const cmd=cr.dataset.cmd;
    cr.querySelectorAll(".seg.scope button").forEach(b=>b.onclick=()=>setScope(f,cmd,cr,b.dataset.v));
    const rs=cr.querySelector(".rst");if(rs)rs.onclick=()=>setScope(f,cmd,cr,"reset");});
  return card;
}
function scopeRow(c){const S=["global","folder","device","remote"];
  const tip={global:"runs anywhere via SCM",folder:"SCM config in the active folder",device:"targets a device via SCM tunnel (no 2FA)",remote:"SSH to the device (2FA)"};
  return `<div class="crow" data-cmd="${escA(c.command)}"><span class="cname" title="${escA(c.description||c.command)}">${esc(c.command)}${c.ssh?' <span class="ssh">SSH</span>':''}</span>
  <span class="seg scope">${S.map(s=>`<button data-v="${s}" title="${tip[s]}" class="${c.effective_scope===s?'sel':''}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</span>
  <button class="rst" title="Reset to code default (${c.code_scope})">${c.overridden?"reset":"&nbsp;"}</button></div>`;}
async function setFState(f,card,v){if(f.state===v)return;
  try{await post("/api/feature",{flag:f.flag,state:v});f.state=v;
    card.querySelectorAll(".seg.st button").forEach(b=>b.classList.toggle("sel",b.dataset.v===v));flash(card);
    loadSidebar();toast(`${f.title||f.flag} → ${v.toUpperCase()}`);}catch(e){toast("Error: "+e.message,true);}}
async function setScope(f,cmd,cr,v){
  try{const r=await post("/api/scope",{command:cmd,scope:v==="reset"?null:v});
    const c=(f.commands||[]).find(c=>c.command===cmd);if(c){c.effective_scope=r.effective_scope;c.overridden=r.overridden;}
    cr.querySelectorAll(".seg.scope button").forEach(b=>b.classList.toggle("sel",b.dataset.v===r.effective_scope));
    const rs=cr.querySelector(".rst");if(rs)rs.innerHTML=r.overridden?"reset":"&nbsp;";
    const card=cr.closest(".card");const old=card.querySelector(".badge");if(old)old.outerHTML=scopeSum(f);flash(card);
    toast(`${cmd} → ${r.effective_scope}`);}catch(e){toast("Error: "+e.message,true);}}
async function disableArea(hdr){try{await post("/api/area",{area:hdr.area,disabled:true});
  toast(`${hdr.label}: disabled — manage in the Areas tab`);go("areas",null);}catch(e){toast("Error: "+e.message,true);}}

// ---- COMMAND STRUCTURE ----
async function mainStructure(main){
  const data=await api("/api/structure/area?area="+encodeURIComponent(cur.group||""));
  main.appendChild(pageHead(main,data.label));
  const cmds=(data.commands||[]).filter(c=>matchTxt(c.command,filter)||matchTxt(c.description,filter));
  if(!cmds.length){main.appendChild(el("div","empty","No commands match."));return;}
  cmds.forEach(c=>main.appendChild(structCard(c)));
}
function structCard(c){
  const card=el("div","card");card.dataset.cmd=c.command;
  const tag=c.override?'<span class="badge override">locked</span>':(c.has_structure?'<span class="badge">auto</span>':'<span class="badge">none</span>');
  card.innerHTML=`<div class="rmain"><div class="rinfo"><div class="rtitle mono">${esc(c.command)} ${tag}</div>
    <div class="rsub">${esc(c.description||"")}</div></div>
    <button class="expand">▸ edit fields (${c.field_count})</button></div>
    <div class="detail"></div>`;
  card.querySelector(".rinfo").prepend(qmark("command="+encodeURIComponent(c.command)));
  const ex=card.querySelector(".expand");
  ex.onclick=async()=>{const open=card.classList.toggle("open");ex.textContent=(open?"▾":"▸")+" edit fields ("+c.field_count+")";
    if(open&&!card.querySelector(".detail").dataset.loaded){await loadFieldEditor(card,c.command);}};
  return card;
}
async function loadFieldEditor(card,command){
  const st=await api("/api/structure/item?command="+encodeURIComponent(command));
  const det=card.querySelector(".detail");det.dataset.loaded="1";
  let fields=JSON.parse(JSON.stringify(st.fields||[]));
  function draw(){
    det.innerHTML=`<div class="dhint">Reorder and edit how this command parses arguments.</div><div class="fw"></div>
      <div style="margin-top:.6rem;display:flex;gap:.5rem"><button class="btn sm" data-a="add">+ Add field</button>
      <button class="btn primary" data-a="save">Save (lock)</button><button class="btn sm" data-a="reset">Reset to auto</button></div>`;
    const fw=det.querySelector(".fw");
    fields.forEach((f,i)=>{
      const r=el("div","frow");
      r.innerHTML=`<span style="color:var(--text-3);cursor:grab">⋮⋮</span>
        <input class="fn" value="${escA(f.name)}" placeholder="name"/>
        <select class="fk">${["value","choice","keyword"].map(k=>`<option ${f.kind===k?"selected":""}>${k}</option>`).join("")}</select>
        <label class="chk"><input type="checkbox" class="fr" ${f.required?"checked":""}/>req</label>
        <input class="fh" value="${escA(f.hint||"")}" placeholder="hint"/>
        <input class="fc" value="${escA((f.choices||[]).join(', '))}" placeholder="choices (comma)" ${f.kind==="choice"?"":"style=display:none"}/>
        <button class="btn sm" data-m="up" ${i===0?"disabled":""}>↑</button>
        <button class="btn sm" data-m="down" ${i===fields.length-1?"disabled":""}>↓</button>
        <button class="del" title="Remove">×</button>`;
      r.querySelector(".fn").oninput=e=>f.name=e.target.value;
      r.querySelector(".fk").onchange=e=>{f.kind=e.target.value;draw();};
      r.querySelector(".fr").onchange=e=>f.required=e.target.checked;
      r.querySelector(".fh").oninput=e=>f.hint=e.target.value;
      const fc=r.querySelector(".fc");if(fc)fc.oninput=e=>f.choices=e.target.value.split(",").map(s=>s.trim()).filter(Boolean);
      r.querySelector('[data-m="up"]').onclick=()=>{if(i>0){[fields[i-1],fields[i]]=[fields[i],fields[i-1]];draw();}};
      r.querySelector('[data-m="down"]').onclick=()=>{if(i<fields.length-1){[fields[i+1],fields[i]]=[fields[i],fields[i+1]];draw();}};
      r.querySelector(".del").onclick=()=>{fields.splice(i,1);draw();};
      fw.appendChild(r);
    });
    det.querySelector('[data-a="add"]').onclick=()=>{fields.push({name:"field",kind:"value",required:false,hint:"",choices:[]});draw();};
    det.querySelector('[data-a="save"]').onclick=async()=>{try{await post("/api/structure",{command,fields});toast(command+": saved (locked)");route();}catch(e){toast("Error: "+e.message,true);}};
    det.querySelector('[data-a="reset"]').onclick=async()=>{try{await post("/api/structure",{command,fields:[]});toast(command+": reset to auto");route();}catch(e){toast("Error: "+e.message,true);}};
  }
  draw();
}

// ---- ALIASES ----
async function mainAliases(main){
  const data=await api("/api/aliases");const grp=(cur.group==="user")?"user":"system";
  main.appendChild(pageHead(main,grp==="user"?"My aliases":"System aliases"));
  const add=el("div","aadd");
  add.innerHTML=`<input class="an" placeholder="alias (e.g. sap)"/><input class="ax" placeholder="expands to… (e.g. show address)"/><button class="btn">Add</button>`;
  add.querySelector(".btn").onclick=()=>{const an=add.querySelector(".an").value.trim(),ax=add.querySelector(".ax").value.trim();if(an&&ax)saveAlias(grp,an,ax);};
  main.appendChild(add);
  const rows=(data[grp]||[]).filter(a=>matchTxt(a.name,filter)||matchTxt(a.expansion,filter));
  if(!rows.length){main.appendChild(el("div","empty","No aliases"+(filter?' match "'+esc(filter)+'"':"")+"."));return;}
  rows.forEach(a=>{const r=el("div","arow");
    r.innerHTML=`<span class="an">${esc(a.name)}</span><span class="aw">→</span><input class="ax" value="${escA(a.expansion)}"/><button class="btn sm save">Save</button><button class="btn sm del">Delete</button>`;
    r.querySelector(".save").onclick=()=>saveAlias(grp,a.name,r.querySelector(".ax").value.trim());
    r.querySelector(".del").onclick=()=>saveAlias(grp,a.name,null);main.appendChild(r);});
}
async function saveAlias(scope,name,expansion){try{await post("/api/alias",{scope,name,expansion});
  toast(expansion===null?`Deleted ${name}`:`Alias ${name} saved`);loadSidebar();loadMain();}catch(e){toast("Error: "+e.message,true);}}

// ---- BUILT-INS ----
const BSTATES=[["true","SHOWN"],["dev","DEV"],["hidden","HIDDEN"],["false","DISABLED"]];
const BVIS={visible:"true",dev:"dev",hidden:"hidden",blocked:"false"};
async function mainBuiltins(main){
  const data=await api("/api/builtins?group="+encodeURIComponent(cur.group||""));
  main.appendChild(pageHead(main,cur.group));
  const items=(data.items||[]).filter(b=>matchTxt(b.name,filter)||matchTxt(b.help,filter)||matchTxt(b.display,filter));
  if(!items.length){main.appendChild(el("div","empty","No builtins match."));return;}
  items.forEach(b=>main.appendChild(builtinCard(b)));
}
function builtinCard(b){
  const card=el("div","card");card.dataset.name=b.name;const curv=BVIS[b.visible]||"true";
  card.innerHTML=`<div class="rmain"><div class="rinfo"><div class="rtitle mono">${esc(b.display||b.name)}<span class="rtech">${esc(b.name)}</span></div>
    <div class="rsub">${esc(b.help||"(no help text)")}</div></div>
    <div class="seg st">${BSTATES.map(([v,l])=>`<button data-v="${v}" class="${curv===v?'sel':''}">${l}</button>`).join("")}</div>
    <button class="expand">▸ edit</button></div>
    <div class="detail brow-detail">
      <label>Display name (shown in ? help)</label><input class="bd" value="${escA(b.display||"")}"/>
      <label>Help text</label><input class="bh" value="${escA(b.help||"")}"/>
      <div class="toggles">
        <div class="ctrl"><label>Configure-mode only</label><div class="toggle ${b.configure_only?'on':''}" data-t="configure_only"><div class="knob"></div></div></div>
        <div class="ctrl"><label>Hide in configure mode</label><div class="toggle ${b.hide_in_configure?'on':''}" data-t="hide_in_configure"><div class="knob"></div></div></div>
      </div></div>`;
  card.querySelector(".rinfo").prepend(qmark("topic=builtins"));
  const ex=card.querySelector(".expand");ex.onclick=()=>{const o=card.classList.toggle("open");ex.textContent=(o?"▾":"▸")+" edit";};
  card.querySelectorAll(".seg.st button").forEach(bt=>bt.onclick=()=>setBuiltin(b,card,"visible",bt.dataset.v,bt));
  const bd=card.querySelector(".bd");bd.onchange=()=>setBuiltin(b,card,"display",bd.value);
  const bh=card.querySelector(".bh");bh.onchange=()=>setBuiltin(b,card,"help",bh.value);
  card.querySelectorAll("[data-t]").forEach(tg=>tg.onclick=()=>{const field=tg.dataset.t;const nv=!b[field];
    setBuiltin(b,card,field,nv).then(()=>tg.classList.toggle("on",nv));});
  return card;
}
async function setBuiltin(b,card,field,value,btn){
  try{const r=await post("/api/builtin",{name:b.name,field,value});Object.assign(b,r);
    if(field==="visible"&&btn){const curv=BVIS[r.visible]||"true";card.querySelectorAll(".seg.st button").forEach(x=>x.classList.toggle("sel",x.dataset.v===curv));}
    flash(card);toast(`${b.name}: ${field} updated`);}catch(e){toast("Error: "+e.message,true);}
}

// ---- ADVANCED / FILES ----
async function mainAdvanced(main){
  const data=await api("/api/files");
  const d=(data.domains||[]).find(x=>x.stem===cur.group)||data.domains[0];
  if(!d){main.appendChild(pageHead(main,"Advanced"));main.appendChild(el("div","empty","No files."));return;}
  main.appendChild(pageHead(main,d.label));
  const note=el("div");note.style.cssText="color:var(--text-2);font-size:13px;margin:-.4rem 0 1rem;max-width:80ch";
  note.innerHTML="<b>Advanced regeneration settings</b> \u2014 not an on/off switch. To turn features on or off use <b>Features</b>; to disable a whole area use <b>Areas</b>. These control what happens when the file is <i>regenerated</i> from the API specs.";
  main.appendChild(note);
  const card=el("div","card");card.style.padding="1rem";
  card.innerHTML=`<div class="rtitle">${esc(d.label)} <span class="rtech">${d.stem}.json</span></div>
    <div class="muted" style="margin:.4rem 0 .9rem">${esc((d.readme||"").slice(0,260))}</div>
    <div style="display:flex;gap:2rem;flex-wrap:wrap;align-items:center">
      <div class="ctrl"><label>Default state</label><span class="seg df">${["on","dev","off"].map(s=>`<button data-v="${s}" class="${d.default===s?'sel':''}">${s.toUpperCase()}</button>`).join("")}</span></div>
      <div class="ctrl"><label>Keep my edits</label><div class="toggle ${d.carry?'on':''}" id="carry"><div class="knob"></div></div></div>
    </div>`;
  card.querySelectorAll(".seg.df button").forEach(b=>b.onclick=()=>setFile(d,card,"default",b.dataset.v));
  card.querySelector("#carry").onclick=e=>setFile(d,card,"carry",!d.carry,e.currentTarget);
  main.appendChild(card);
}
async function setFile(d,card,field,value,tog){
  try{const body={domain:d.stem};body[field]=value;const r=await post("/api/meta",body);
    if(field==="default"){d.default=r.default;card.querySelectorAll(".seg.df button").forEach(b=>b.classList.toggle("sel",b.dataset.v===value));}
    else{d.carry=r.carry;if(tog)tog.classList.toggle("on",r.carry);}
    toast(`${d.label}: ${field} updated`);}catch(e){toast("Error: "+e.message,true);}
}

// ---- THEME (application only; editing lives in `arc gui-configure`) ----
let themeData=null;         // {tokens, themes:[{name,colors}], active:{base,overrides}}
let themeWork={base:"Default",overrides:{}};
function themeColors(base){const t=(themeData.themes||[]).find(t=>t.name===base);return t?t.colors:{};}
function effColor(token){return themeWork.overrides[token]||themeColors(themeWork.base)[token]||"";}
function applyWorking(){const root=document.documentElement;
  (themeData.tokens||[]).forEach(tk=>{const v=effColor(tk);if(v)root.style.setProperty(tk,v);});}
async function loadTheme(){themeData=await api("/api/theme");
  themeWork={base:themeData.active.base||"Default",overrides:Object.assign({},themeData.active.overrides||{})};
  applyWorking();}

// ---- shell ----
function buildTabs(){const t=document.getElementById("tabs");
  SECTIONS.forEach(s=>{const b=el("div","tab","");b.dataset.k=s.key;b.textContent=s.label;b.onclick=()=>go(s.key,null);t.appendChild(b);});}
document.getElementById("search").addEventListener("input",e=>{filter=e.target.value.trim();loadMain();});
document.getElementById("mclose").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show");};
async function closeEditor(){try{await fetch("/api/close",{method:"POST"});}catch(e){}stopHeartbeat();document.getElementById("closedv").classList.add("show");}
document.getElementById("done").onclick=closeEditor;
window.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=document.getElementById("modal");if(m.classList.contains("show"))m.classList.remove("show");else closeEditor();}});
// Tab-lifecycle heartbeat (startHeartbeat/stopHeartbeat) lives in the shared
// gui.js and auto-starts on DOMContentLoaded; closeEditor() calls stopHeartbeat.
buildTabs();
if(!location.hash)location.hash="features";
// Apply the user's saved theme before first render so the GUI opens in it.
loadTheme().catch(()=>{}).finally(route);
</script>
