[project]
name = "arc"
version = "0.1.17"
description = "Assisted Remote Console — PAN-OS-style interactive shell for SCM and SSH"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "cryptography",
    "httpx",
    "keyring",
    "paramiko>=3.4.0",
    "platformdirs",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx",
    "respx",
    "ruff",
    "pyyaml",
]

[project.scripts]
arc = "app.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

