[project]
name = "arc"
version = "0.1.20"
description = "Assisted Remote Console — PAN-OS-style interactive shell for SCM and SSH"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "cryptography",
    "httpx",
    "keyring",
    "paramiko",
    "platformdirs",
    "prompt-toolkit",
    "pydantic",
    "rich",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx",
    "respx",
    "ruff",
    "pyyaml",
]

[project.scripts]
arc = "app.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/shell/_base.py" = ["F401"]  # shared re-export spine for shell mixins

