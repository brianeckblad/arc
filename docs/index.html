<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC Documentation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-theme" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* ─── Design Tokens ──────────────────────────────────────────────── */
    :root {
      --brand:          #0070D1;
      --brand-hover:    #3395E8;
      --teal:           #009CA6;
      --green:          #22C55E;
      --yellow:         #F59E0B;
      --red:            #EF4444;

      --header-h:       60px;
      --sidebar-w:      260px;
      --toc-w:          220px;
      --content-max:    780px;
      --radius:         6px;
      --mono:           'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      --sans:           'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    [data-theme="dark"] {
      --bg:             #0B0E1A;
      --bg-sidebar:     #111525;
      --bg-card:        #171B2E;
      --bg-hover:       #1E2340;
      --bg-active:      rgba(0,112,209,.15);
      --bg-code:        #0D1020;
      --border:         #1E2340;
      --text:           #D8DCF0;
      --text-2:         #8896B8;
      --text-3:         #505A75;
      --header-bg:      #0B0E1A;
      --header-border:  #1E2340;
    }
    [data-theme="light"] {
      --bg:             #FFFFFF;
      --bg-sidebar:     #F4F6FB;
      --bg-card:        #F9FAFD;
      --bg-hover:       #EBEEf8;
      --bg-active:      rgba(0,112,209,.08);
      --bg-code:        #1E2235;
      --border:         #DEE2F0;
      --text:           #1A1D2E;
      --text-2:         #4A5272;
      --text-3:         #8896B8;
      --header-bg:      #111525;
      --header-border:  #1E2340;
    }

    /* ─── Reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: var(--brand); text-decoration: none; }
    a:hover { color: var(--brand-hover); text-decoration: underline; }

    /* ─── Header ─────────────────────────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: var(--header-h);
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 1.25rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: var(--sidebar-w);
      text-decoration: none;
    }
    .logo-badge {
      background: var(--brand);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      padding: 3px 9px;
      border-radius: 4px;
    }
    .logo-name {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -.01em;
    }
    .logo-sub {
      color: var(--text-2);
      font-size: 13px;
      font-weight: 400;
    }
    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .45;
      pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 14px 7px 34px;
      font-size: 14px;
      color: var(--text);
      font-family: var(--sans);
      outline: none;
      transition: border-color .15s;
    }
    #search::placeholder { color: var(--text-3); }
    #search:focus { border-color: var(--brand); }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: var(--radius);
      cursor: pointer;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
    .version-badge {
      font-size: 12px;
      color: var(--text-3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
    }

    /* ─── Layout ─────────────────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
    }

    /* ─── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      overflow-y: auto;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 1.25rem 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .nav-section { margin-bottom: .25rem; }
    .nav-section-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1.25rem .35rem;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-3);
      cursor: pointer;
      user-select: none;
    }
    .nav-section-header:hover { color: var(--text-2); }
    .nav-section-header .chevron {
      margin-left: auto;
      font-size: 10px;
      transition: transform .2s;
    }
    .nav-section.collapsed .nav-items { display: none; }
    .nav-section.collapsed .chevron { transform: rotate(-90deg); }

    .nav-item {
      display: block;
      padding: 5px 1.25rem 5px 2.25rem;
      font-size: 13.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid transparent;
      transition: color .12s, background .12s, border-color .12s;
      cursor: pointer;
    }
    .nav-item:hover {
      color: var(--text);
      background: var(--bg-hover);
      text-decoration: none;
    }
    .nav-item.active {
      color: var(--brand);
      background: var(--bg-active);
      border-left-color: var(--brand);
      font-weight: 500;
    }
    .nav-item.filtered-hide { display: none; }

    /* ─── Main content area ──────────────────────────────────────────── */
    .content-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .breadcrumb {
      padding: .75rem 2rem;
      font-size: 12.5px;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .breadcrumb span { color: var(--text-2); }
    .breadcrumb span + span::before { content: ' / '; }
    #article {
      flex: 1;
      padding: 2.5rem 2rem 3rem;
      max-width: var(--content-max);
      width: 100%;
    }

    /* ─── Markdown content styles ────────────────────────────────────── */
    #article h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .75rem;
    }
    #article h2 {
      font-size: 1.45rem;
      font-weight: 600;
      margin-top: 2.5rem;
      margin-bottom: .75rem;
    }
    #article h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: .5rem;
    }
    #article h4 {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: .4rem;
      color: var(--text-2);
    }
    #article p { margin-bottom: 1rem; }
    #article ul, #article ol {
      margin: .5rem 0 1rem 1.5rem;
    }
    #article li { margin-bottom: .25rem; }
    #article strong { font-weight: 600; }
    #article em { font-style: italic; }
    #article hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    #article table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 14px;
    }
    #article th {
      background: var(--bg-card);
      font-weight: 600;
      text-align: left;
      padding: 8px 14px;
      border: 1px solid var(--border);
    }
    #article td {
      padding: 7px 14px;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    #article tr:nth-child(even) td { background: var(--bg-card); }

    /* Inline code */
    #article :not(pre) > code {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: var(--mono);
      font-size: .85em;
      color: var(--teal);
    }
    /* Code blocks */
    #article pre {
      position: relative;
      background: var(--bg-code) !important;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 1rem 0 1.5rem;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.6;
    }
    #article pre > code {
      font-family: var(--mono) !important;
      font-size: inherit !important;
      background: none !important;
      border: none !important;
      padding: 0 !important;
      color: inherit;
    }
    /* copy button */
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-3);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 9px;
      font-family: var(--sans);
      transition: color .12s, background .12s;
    }
    .copy-btn:hover { color: var(--text); background: var(--bg-hover); }
    .copy-btn.copied { color: var(--green); }

    /* Blockquote callouts */
    #article blockquote {
      border-left: 3px solid var(--brand);
      background: var(--bg-card);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: .75rem 1rem;
      margin: 1rem 0 1.25rem;
      color: var(--text-2);
    }
    /* Callout variants */
    #article blockquote.callout-warning {
      border-left-color: var(--yellow);
    }
    #article blockquote.callout-danger {
      border-left-color: var(--red);
    }
    #article blockquote.callout-tip {
      border-left-color: var(--teal);
    }

    /* Status badges */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 2px 8px;
      border-radius: 20px;
      vertical-align: middle;
    }
    .badge-live     { background: rgba(34,197,94,.15); color: var(--green); border: 1px solid rgba(34,197,94,.3); }
    .badge-pending  { background: rgba(245,158,11,.12); color: var(--yellow); border: 1px solid rgba(245,158,11,.3); }
    .badge-ssh      { background: rgba(0,156,166,.12); color: var(--teal); border: 1px solid rgba(0,156,166,.3); }

    /* ─── TOC sidebar ─────────────────────────────────────────────────── */
    .toc-sidebar {
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      width: var(--toc-w);
      min-width: var(--toc-w);
      overflow-y: auto;
      padding: 1.5rem 1.25rem;
      border-left: 1px solid var(--border);
      font-size: 13px;
    }
    .toc-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: .75rem;
    }
    .toc-list { list-style: none; }
    .toc-item { margin-bottom: .2rem; }
    .toc-item a {
      color: var(--text-3);
      font-size: 12.5px;
      display: block;
      padding: 2px 0;
      transition: color .12s;
    }
    .toc-item a:hover { color: var(--text-2); text-decoration: none; }
    .toc-item.active a { color: var(--brand); font-weight: 500; }
    .toc-sub { padding-left: .85rem; }
    .toc-sub a { color: var(--text-3); font-size: 12px; }

    /* ─── Loading / error states ─────────────────────────────────────── */
    .loading-state, .error-state {
      padding: 3rem 0;
      text-align: center;
      color: var(--text-3);
    }
    .loading-state .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { color: var(--red); }

    /* ─── Prev / Next navigation ─────────────────────────────────────── */
    .page-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      gap: 1rem;
    }
    .page-nav a {
      display: flex;
      flex-direction: column;
      gap: .2rem;
      padding: .75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text);
      min-width: 160px;
      max-width: 48%;
      transition: border-color .15s, background .15s;
    }
    .page-nav a:hover { border-color: var(--brand); background: var(--bg-active); text-decoration: none; }
    .page-nav .nav-direction { font-size: 11px; color: var(--text-3); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
    .page-nav .nav-label { font-weight: 600; font-size: 14px; color: var(--brand); }
    .page-nav .next-link { text-align: right; margin-left: auto; }

    /* ─── Search highlight ─────────────────────────────────────────────── */
    .search-highlight { background: rgba(0,112,209,.25); border-radius: 2px; }

    /* ─── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .toc-sidebar { display: none; }
    }
    @media (max-width: 720px) {
      :root { --sidebar-w: 0px; }
      .sidebar { display: none; }
      #article { padding: 1.5rem 1.25rem; }
    }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header class="site-header">
  <a class="logo" href="?page=README.md" onclick="navigate('README.md');return false;">
    <span class="logo-badge">ARC</span>
    <span class="logo-name">Docs</span>
    <span class="logo-sub">Assisted Remote Console</span>
  </a>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" id="search" placeholder="Search commands…" autocomplete="off" spellcheck="false" />
  </div>

  <div class="header-right">
    <span class="version-badge">v0.1.0</span>
    <button class="icon-btn" id="theme-toggle" title="Toggle light/dark mode">◑</button>
  </div>
</header>

<!-- ── Layout ───────────────────────────────────────────────────────────── -->
<div class="layout">

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <nav id="nav-tree"></nav>
  </aside>

  <!-- ── Main content ─────────────────────────────────────────────────── -->
  <div class="content-wrap">
    <div class="breadcrumb" id="breadcrumb">
      <span>ARC</span>
    </div>
    <div id="article">
      <div class="loading-state">
        <div class="spinner"></div>
        Loading documentation…
      </div>
    </div>
  </div>

  <!-- ── TOC sidebar ──────────────────────────────────────────────────── -->
  <aside class="toc-sidebar" id="toc-sidebar">
    <div class="toc-title">On This Page</div>
    <ul class="toc-list" id="toc"></ul>
  </aside>

</div>

<script>
/* ─── Navigation tree definition ─────────────────────────────────────── */
const NAV = [
  {
    id: 'getting-started',
    title: 'Getting Started',
    icon: '🚀',
    items: [
      { title: 'Overview',       page: 'README.md' },
      { title: 'Usage Guide',    page: 'usage.md' },
      { title: 'Configuration',  page: 'configuration.md' },
      { title: 'Architecture',   page: 'architecture.md' },
    ]
  },
  {
    id: 'shell-commands',
    title: 'Shell Commands',
    icon: '⌨',
    items: [
      { title: 'cd — Change Device',        page: 'commands/cd.md' },
      { title: 'remote — SSH Passthrough',  page: 'commands/remote.md' },
      { title: 'connect — SSH Connect',     page: 'commands/connect.md' },
      { title: 'folder — Set Folder',       page: 'commands/folder.md' },
      { title: 'ls — List Devices',         page: 'commands/ls.md' },
      { title: 'pwd — Show Context',         page: 'commands/pwd.md' },
      { title: 'docs / help',               page: 'commands/help.md' },
      { title: 'clear',                     page: 'commands/clear.md' },
      { title: 'exit / quit',               page: 'commands/exit.md' },
    ]
  },
  {
    id: 'registered-commands',
    title: 'Registered Commands',
    icon: '📋',
    dynamic: true,  // loaded from commands/index.md
    items: []
  },
];

/* ─── State ───────────────────────────────────────────────────────────── */
let currentPage = 'README.md';
let allNavItems = [];   // flat list of {title, page} for search

/* ─── Utilities ──────────────────────────────────────────────────────── */
function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function getPageParam() {
  const params = new URLSearchParams(window.location.search);
  return params.get('page') || 'README.md';
}

function setPageParam(page) {
  const url = new URL(window.location);
  url.searchParams.set('page', page);
  history.pushState({page}, '', url);
}

function sectionTitle(page) {
  const parts = page.replace('.md', '').split('/');
  return parts[parts.length - 1]
    .replace(/-/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

/* ─── Sidebar builder ────────────────────────────────────────────────── */
function buildNav(registeredItems) {
  const nav = document.getElementById('nav-tree');
  nav.innerHTML = '';
  allNavItems = [];

  // Merge dynamic items
  const sections = NAV.map(s => {
    if (s.dynamic) return { ...s, items: registeredItems };
    return s;
  });

  sections.forEach(section => {
    const el = document.createElement('div');
    el.className = 'nav-section';
    el.dataset.sectionId = section.id;

    const header = document.createElement('div');
    header.className = 'nav-section-header';
    header.innerHTML = `
      <span>${section.icon}</span>
      <span>${section.title}</span>
      <span class="chevron">▾</span>
    `;
    header.addEventListener('click', () => {
      el.classList.toggle('collapsed');
    });

    const itemsEl = document.createElement('div');
    itemsEl.className = 'nav-items';

    section.items.forEach(item => {
      const a = document.createElement('div');
      a.className = 'nav-item';
      a.textContent = item.title;
      a.dataset.page = item.page;
      a.addEventListener('click', () => navigate(item.page));
      itemsEl.appendChild(a);
      allNavItems.push(item);
    });

    el.appendChild(header);
    el.appendChild(itemsEl);
    nav.appendChild(el);
  });

  markActive(currentPage);
}

function markActive(page) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  // Expand the section containing the active item
  document.querySelectorAll('.nav-item.active').forEach(el => {
    el.closest('.nav-section')?.classList.remove('collapsed');
  });
}

/* ─── Fetch registered commands from index.md ────────────────────────── */
async function loadRegisteredCommands() {
  try {
    const resp = await fetch('commands/index.md');
    if (!resp.ok) return [];
    const text = await resp.text();
    const items = [];
    for (const line of text.split('\n')) {
      const m = line.match(/^-\s+`([^`]+)`/);
      if (m) {
        const cmd = m[1];
        items.push({ title: cmd, page: `commands/${slugify(cmd)}.md` });
      }
    }
    return items;
  } catch {
    return [];
  }
}

/* ─── Markdown rendering ─────────────────────────────────────────────── */
function renderMarkdown(text) {
  // Configure marked
  marked.setOptions({
    gfm: true,
    breaks: false,
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    }
  });

  let html = marked.parse(text);

  // Detect callout blockquotes: > **Note:** / **Warning:** / **Tip:**
  html = html.replace(
    /<blockquote>\s*<p><strong>(Warning|Caution|Danger)<\/strong>/gi,
    '<blockquote class="callout-warning"><p><strong>$1</strong>'
  );
  html = html.replace(
    /<blockquote>\s*<p><strong>(Tip|Info)<\/strong>/gi,
    '<blockquote class="callout-tip"><p><strong>$1</strong>'
  );

  return html;
}

function addCopyButtons() {
  document.querySelectorAll('#article pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'copy';
    btn.addEventListener('click', () => {
      const code = pre.querySelector('code')?.innerText || pre.innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'copy';
          btn.classList.remove('copied');
        }, 1800);
      });
    });
    pre.appendChild(btn);
  });
}

function buildTOC() {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  const headings = document.querySelectorAll('#article h2, #article h3');
  if (headings.length === 0) {
    document.getElementById('toc-sidebar').style.display = 'none';
    return;
  }
  document.getElementById('toc-sidebar').style.display = '';

  headings.forEach((h, i) => {
    if (!h.id) h.id = `toc-${i}-${slugify(h.textContent)}`;
    const li = document.createElement('li');
    li.className = 'toc-item' + (h.tagName === 'H3' ? ' toc-sub' : '');
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function updateBreadcrumb(page) {
  const crumb = document.getElementById('breadcrumb');
  const parts = page.replace('.md', '').split('/');
  crumb.innerHTML = '<span>ARC</span>' +
    parts.map(p => `<span>${p.replace(/-/g, ' ').replace(/\b\w/g,c=>c.toUpperCase())}</span>`).join('');
}

/* ─── Page loading ───────────────────────────────────────────────────── */
async function navigate(page) {
  currentPage = page;
  setPageParam(page);
  markActive(page);
  updateBreadcrumb(page);
  document.getElementById('toc').innerHTML = '';

  const article = document.getElementById('article');
  article.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>';

  try {
    const resp = await fetch(page);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();

    article.innerHTML = renderMarkdown(text);
    hljs.highlightAll();
    addCopyButtons();
    buildTOC();
    window.scrollTo(0, 0);

    // Handle anchor from hash
    if (window.location.hash) {
      const el = document.querySelector(window.location.hash);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  } catch (err) {
    article.innerHTML = `
      <div class="error-state">
        <p>⚠ Could not load <code>${page}</code></p>
        <p style="margin-top:.5rem;font-size:13px;color:var(--text-3)">${err.message}</p>
        <p style="margin-top:1rem;font-size:13px;color:var(--text-3)">
          Make sure ARC docs server is running: <code>arc docs</code>
        </p>
      </div>
    `;
  }
}

/* ─── Search ─────────────────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    if (!q) {
      el.classList.remove('filtered-hide');
      return;
    }
    const match = el.textContent.toLowerCase().includes(q) ||
                  (el.dataset.page || '').toLowerCase().includes(q);
    el.classList.toggle('filtered-hide', !match);
  });
  // Expand all sections when searching, collapse when cleared
  document.querySelectorAll('.nav-section').forEach(s => {
    if (q) s.classList.remove('collapsed');
  });
});

/* ─── Theme toggle ───────────────────────────────────────────────────── */
document.getElementById('theme-toggle').addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.dataset.theme === 'dark';
  root.dataset.theme = isDark ? 'light' : 'dark';
  const hlTheme = document.getElementById('hl-theme');
  hlTheme.href = isDark
    ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css'
    : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
  try { localStorage.setItem('arc-docs-theme', root.dataset.theme); } catch {}
});

/* restore saved theme */
try {
  const saved = localStorage.getItem('arc-docs-theme');
  if (saved) document.documentElement.dataset.theme = saved;
} catch {}

/* ─── Browser history ────────────────────────────────────────────────── */
window.addEventListener('popstate', e => {
  if (e.state?.page) navigate(e.state.page);
});

/* ─── Bootstrap ──────────────────────────────────────────────────────── */
(async function init() {
  const registeredItems = await loadRegisteredCommands();
  buildNav(registeredItems);
  const page = getPageParam();
  navigate(page);
})();
</script>
</body>
</html>
